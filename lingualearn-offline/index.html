<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaLearn Pro – Offline Translator</title>
  <meta name="description" content="Professional offline translator (40+ languages)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192x192.png">
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    /* inline skeleton while styles load */
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;font-size:16px;background:#f2f5ff;color:#333}
    #appLoader{display:flex;align-items:center;justify-content:center;height:100vh}
    .spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#4361ee;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="appLoader"><div class="spinner"></div></div>
  <div id="root" style="display:none"></div>

  <!-- Preload critical modules -->
  <link rel="modulepreload" href="src/main.js">
  <link rel="modulepreload" href="src/components/TranslationEngine.js">
  <link rel="modulepreload" href="src/components/OCRManager.js">

  <script type="module" src="src/main.js"></script>
</body>
</html>
